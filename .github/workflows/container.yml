name: Container

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '9 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record host-compatible IDs
        id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Audit production Node dependencies
        run: npm --prefix studio audit --omit=dev --audit-level=high

      - name: Build runtime image
        run: |
          docker build \
            --build-arg REELMAESTRO_UID=${{ steps.ids.outputs.uid }} \
            --build-arg REELMAESTRO_GID=${{ steps.ids.outputs.gid }} \
            --tag reel-maestro:ci .

      - name: Verify bundled dependencies and CLI
        run: |
          docker run --rm --entrypoint sh reel-maestro:ci -c '
            set -eu
            test "$(id -u)" != 0
            reelmaestro --help >/dev/null
            ffmpeg -hide_banner -version >/dev/null
            ffprobe -hide_banner -version >/dev/null
            ffmpeg -hide_banner -filters 2>/dev/null | grep -q subtitles
            whisper_timestamped --help >/dev/null
            test -s "$HOME/.cache/whisper/base.pt"
            echo "ed3a0b6b1c0edf879ad9b11b1af5a0e6ab5db9205f891f668f8b0e6c6326e34e  $HOME/.cache/whisper/base.pt" | sha256sum -c -
            test ! -e /app/src
            test ! -e /app/Cargo.toml
            test -s /app/THIRD_PARTY_NOTICES.txt
            test -s /app/studio/web/dist/licenses/Inter.txt
            test -s /app/studio/web/dist/licenses/JetBrainsMono.txt
            test -s /app/LICENSES/Whisper-MIT.txt
          '

      - name: Verify offline Studio readiness
        run: |
          docker run --detach --name reel-maestro-studio-ci \
            --env REELMAESTRO_PORT=3337 reel-maestro:ci
          trap 'docker logs reel-maestro-studio-ci; docker rm --force reel-maestro-studio-ci' EXIT
          for attempt in $(seq 1 30); do
            docker exec reel-maestro-studio-ci \
              node /usr/local/lib/reelmaestro/healthcheck.js && break
            sleep 1
          done
          docker exec reel-maestro-studio-ci node /usr/local/lib/reelmaestro/healthcheck.js

      - name: Render offline fixture into host output
        run: |
          mkdir -p container-output
          docker run --rm --network none \
            --volume "$PWD/container-output:/data/out" \
            --entrypoint /usr/local/lib/reelmaestro/offline-fixture.sh \
            reel-maestro:ci
          test -s container-output/docker-offline-fixture/reel.mp4

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: false

      - name: Scan image and retain inventory
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          script="$GITHUB_WORKSPACE/.github/scripts/scan-image.sh"
          cd "$RUNNER_TEMP"
          bash "$script"

      - name: Retain image security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-runtime-linux-amd64
          path: ${{ runner.temp }}/security-runtime/
          if-no-files-found: error
          retention-days: 30
